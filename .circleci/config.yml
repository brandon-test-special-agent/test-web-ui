version: 2.1

jobs:
  deploy:
    docker:
      - image: cimg/base:stable
    environment:
      TARGET_VERSION: "<< pipeline.deploy.target_version >>"
    steps:
      - checkout
      - run:
          name: Perform deployment
          command: kubectl set image deployment/my-app my-app=my-registry/my-app:${TARGET_VERSION} # TODO: add deployment logic
  cancel-deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Update planned release to CANCELED
          command: |
            circleci run release update \
              --status=CANCELED


workflows:
  deploy:
    jobs:
      - deploy
      - cancel-deploy:
          requires:
            - deploy:
              - canceled
