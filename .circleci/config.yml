version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: curl -fsSL https://get.pnpm.io/install.sh | sh - && source ~/.bashrc
      - run:
          name: Install dependencies
          command: ~/.local/share/pnpm/pnpm install
      - run:
          name: Run lint
          command: ~/.local/share/pnpm/pnpm run lint

  build:
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: curl -fsSL https://get.pnpm.io/install.sh | sh - && source ~/.bashrc
      - run:
          name: Install dependencies
          command: ~/.local/share/pnpm/pnpm install
      - run:
          name: Build application
          command: ~/.local/share/pnpm/pnpm run build

workflows:
  version: 2
  lint-and-build:
    jobs:
      - lint
      - build