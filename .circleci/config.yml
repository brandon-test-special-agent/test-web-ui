version: 2.1

orbs:
  node: circleci/node@7

executors:
  node-executor:
    docker:
      - image: cimg/node:22.14

commands:
  install-deps:
    steps:
      - node/install-packages:
          pkg-manager: pnpm
          cache-path: node_modules
          override-ci-command: pnpm install --no-frozen-lockfile

jobs:
  setup:
    executor: node-executor
    steps:
      - checkout
      - install-deps
      - persist_to_workspace:
          root: .
          paths:
            - .

  lint:
    executor: node-executor
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Run Linting
          command: pnpm lint

  test:
    executor: node-executor
    parallelism: 4
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Run tests (split) with pnpm and store JUnit
          command: |
            mkdir -p test-results
            TEST_FILES=$(circleci tests glob "src/**/*.{test,spec}.{js,ts,jsx,tsx}" | circleci tests split --split-by=timings)
            export JEST_JUNIT_OUTPUT=test-results/junit.xml
            echo "$TEST_FILES" | xargs pnpm test:run --
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results

  build:
    executor: node-executor
    resource_class: medium+
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Build application
          command: pnpm run build

workflows:
  lint-and-build:
    jobs:
      - setup
      - lint:
          requires:
            - setup
      - test:
          requires:
            - setup
      - build:
          requires:
            - lint
            - test