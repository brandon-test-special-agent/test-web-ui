version: 2.1

jobs:
  deploy:
    docker:
      - image: cimg/base:stable
    environment:
      TARGET_VERSION: "<< pipeline.deploy.target_version >>"
    steps:
      - checkout
      - run:
          name: Plan deployment
          command: |
            circleci run release plan "${CIRCLE_JOB}" \
              --environment-name="default" \
              --component-name="${CIRCLE_PROJECT_REPONAME}" \
              --target-version="${TARGET_VERSION}"
      - run:
          name: Perform deployment
          command: kubectl set image deployment/my-app my-app=my-registry/my-app:${TARGET_VERSION} # TODO: add deployment logic
      - run:
          name: Update deployment status to running
          command: circleci run release update "${CIRCLE_JOB}" --status=RUNNING
      - run:
          name: Update deployment status to success
          command: circleci run release update "${CIRCLE_JOB}" --status=SUCCESS
          when: on_success
      - run:
          name: Update deployment status to failed
          command: circleci run release update "${CIRCLE_JOB}" --status=FAILED
          when: on_fail
  cancel-deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Update planned release to CANCELED
          command: |
            circleci run release update \
              --status=CANCELED


workflows:
  deploy:
    jobs:
      - deploy
      - cancel-deploy:
          requires:
            - deploy:
              - canceled
