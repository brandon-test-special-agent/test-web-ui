version: 2.1

orbs:
  node: circleci/node@7

executors:
  node-executor:
    docker:
      - image: cimg/node:22.14

commands:
  install-deps:
    steps:
      - node/install-packages:
          pkg-manager: pnpm
          cache-path: node_modules
          override-ci-command: pnpm install --no-frozen-lockfile

jobs:
  lint:
    executor: node-executor
    steps:
      - checkout
      - install-deps
      - run:
          name: Run Linting
          command: pnpm lint

  test:
    executor: node-executor
    steps:
      - checkout
      - install-deps
      - run:
          name: Run tests (split) with pnpm and store JUnit
          command: |
            mkdir -p test-results
            TEST_FILES=$(circleci tests glob "src/**/*.{test,spec}.{js,ts,jsx,tsx}")
            echo "$TEST_FILES" | circleci tests run --command="xargs -n 1 pnpm test:run -- --reporter=junit --outputFile=test-results/junit.xml" --verbose
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results

  build:
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout
      - install-deps
      - run:
          name: Build application
          command: pnpm run build

workflows:
  lint-and-build:
    jobs:
      - lint
      - test
      - build:
          requires:
            - test