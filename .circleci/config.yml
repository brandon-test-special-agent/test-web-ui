version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: npm install -g pnpm
      - run:
          name: Install dependencies
          command: pnpm install
      - run:
          name: Run lint
          command: pnpm run lint

  build:
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: npm install -g pnpm
      - run:
          name: Install dependencies
          command: pnpm install
      - run:
          name: Build application
          command: pnpm run build

workflows:
  version: 2
  lint-and-build:
    jobs:
      - lint
      - build